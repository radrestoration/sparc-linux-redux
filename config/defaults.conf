# Machine settings for the image that tools/build-debian.sh builds. The package lists are in ultra10-baseline.conf / ultra10-with-x.conf.
# Do not put your own passwords here: copy the settings you want to change into config/local.conf (git-ignored, read after this file),
# or override single values with the command-line options.
# One KEY=value per line, no quotes, no trailing comments. An empty value means "not set".

# The machine's name.
HOSTNAME=ultra10

# The network interface. eth0/eth1 are the kernel's names in probe order (the build switches off udev's renaming to
# enp1s1f1 and the like); eth0 is normally the onboard Happy Meal ethernet.
IFACE=eth0

# Static address in CIDR form. The default is a direct cable to a PC at 192.168.2.3.
ADDRESS=192.168.2.20/24

# Default gateway and nameservers (space-separated). Empty = no route off the cable and no DNS.
GATEWAY=
DNS=

# apt proxy the Ultra uses, for example an apt-cacher-ng on the PC (port 3142). Empty = no proxy (apt needs a route out then).
APT_PROXY=http://192.168.2.3:3142

# root's password in the image. Change it before the machine goes on a real network (best in config/local.conf).
ROOT_PASSWORD=root

# An ordinary user (uid 1000) with the same X session as root. Empty USER_NAME = no user is created.
USER_NAME=
USER_PASSWORD=
# Space-separated groups the user joins (those that do not exist in the image are skipped). "sudo" allows administration.
USER_GROUPS=sudo audio video input plugdev users
# Optional: public key file on this PC, installed as the user's ~/.ssh/authorized_keys, e.g. /home/you/.ssh/id_ed25519.pub
USER_SSH_KEY_FILE=
