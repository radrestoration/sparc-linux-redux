# Baseline configuration for Ultra 10: network, storage, SSH, logging, diagnostics.
# One KEY=value per line, no quotes, no trailing comments.

# Base packages: sysvinit, SSH, storage tools, diagnostics, logging.
# systemd-standalone-sysusers satisfies the dependency of udev and openssh-server sudo without pulling in systemd.
# No chrony: no route to time server; fake-hwclock handles the dead RTC battery.
PACKAGES=sysvinit-core sysv-rc initscripts udev kmod openssh-server ifupdown iproute2 e2fsprogs procps psmisc less nano ca-certificates systemd-standalone-sysusers fake-hwclock hdparm pciutils inetutils-syslogd debian-ports-archive-keyring fbcat
