# Extended configuration for Ultra 10: baseline + X using Debian Ports prebuilt packages (no local X build).
# One KEY=value per line, no quotes, no trailing comments.

# Baseline packages + Xorg (ATI + fbdev video, evdev input), xinit, xterm and X applications (the desktop is CDE: build-debian.sh --with-cde).
PACKAGES=sysvinit-core sysv-rc initscripts udev kmod openssh-server sudo ifupdown iproute2 e2fsprogs procps psmisc fbset less nano ca-certificates systemd-standalone-sysusers fake-hwclock hdparm pciutils inetutils-syslogd debian-ports-archive-keyring xterm xserver-xorg-core xserver-xorg-video-ati xserver-xorg-video-fbdev xserver-xorg-input-evdev xinit xauth x11-xkb-utils xkb-data xfonts-base x11-apps x11-xserver-utils xfonts-75dpi xfonts-100dpi xfonts-scalable dillo x11vnc feh htop nedit tkdesk xfe gv ghostscript xfig xpaint xdaliclock xfonts-terminus xcursor-themes xteddy xbill xgalaga xmahjongg xboard xpenguins xsnow xscreensaver fbcat
